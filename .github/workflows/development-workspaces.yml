name: Development and source reading regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check development-workspaces.js
      - run: node tests/development-workspaces.cjs
      - run: node tests/basic-triage.cjs
