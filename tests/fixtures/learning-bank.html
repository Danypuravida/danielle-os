<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Prévia · Banco de aprendizados</title><style>body{margin:0}#previewNotice{padding:8px 18px;background:#e7ebdf;color:#45533c;font:12px system-ui}.app{max-width:1500px;margin:auto}iframe{background:#fbfaf5;width:100%;height:400px}</style></head><body><div id="previewNotice">PRÉVIA · Dados fictícios para testar a tela. Não acessa nem altera sua conta.</div><div class="app"><aside class="side"><div class="brand">Danielle OS<small>MEU SISTEMA PESSOAL</small></div><nav class="nav"><button>Visão geral</button><button>Resultados</button><button>Tarefas</button><button class="active">Desenvolvimento</button></nav></aside><main class="main"><section class="page active" data-page="central"><div class="card"><h2>Central de desenvolvimento</h2><p>Seu plano e seus aprendizados, no mesmo lugar.</p></div><iframe id="centralFrame" title="Prévia do plano" srcdoc="<p>Seu plano de desenvolvimento permanece nesta área.</p>"></iframe></section></main></div>
<script>
var currentUserId='learning-preview';
const demoDate=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const examples=[
 ['Liderança','Delegar o resultado, não só a tarefa','book','Livro de liderança','Combinar critérios claros antes de delegar.','Usar no próximo alinhamento da equipe.',true],
 ['Liderança','Perguntar antes de resolver','course','Curso de liderança','Uma boa pergunta ajuda a pessoa a construir a solução.','Abrir o próximo 1:1 com uma pergunta.',false],
 ['Negociação','Entender o interesse por trás do pedido','podcast','Podcast de negociação','O pedido inicial pode esconder uma necessidade diferente.','Perguntar qual resultado a outra pessoa precisa.',false],
 ['Produtividade','Reservar um bloco para o trabalho importante','article','Artigo sobre foco','O urgente ocupa o espaço que não foi protegido.','Planejar um bloco de foco antes das mensagens.',true],
 ['IA no trabalho','Dar contexto antes de pedir uma resposta','talk','Palestra de tecnologia','Objetivo e critérios melhoram a utilidade da resposta.','Incluir público, objetivo e formato no pedido.',true],
 ['Comunicação','Fechar a conversa com um acordo','course','Curso de comunicação','Uma conversa só vira ação quando o próximo passo está claro.','Registrar responsável e prazo ao fechar uma reunião.',false],
 ['Estratégia','Escolher o que não fazer','book','Livro de estratégia','Capacidade e tempo precisam acompanhar a escolha de prioridades.','Comparar impacto e esforço antes de abrir uma nova frente.',false]
];
const demo={os_learning_entries:examples.map((e,i)=>({id:'preview-'+i,user_id:currentUserId,topic:e[0],title:e[1],source_type:e[2],source_name:e[3],idea:e[4],application:e[5],applied_at:e[6]?new Date().toISOString():null,source_url:'',application_notes:'',learned_on:demoDate,reviewed_at:null,archived_at:null,updated_at:new Date().toISOString()})),os_learning_weekly_reviews:[]};
var sb={auth:{onAuthStateChange(){}},from(table){let mode='read',payload,filters=[],range=[0,999],single=false,options={};const q={select(){return q},eq(k,v){filters.push([k,v]);return q},order(){return q},range(a,b){range=[a,b];return q},single(){single=true;return q},upsert(p,o={}){mode='upsert';payload=p;options=o;return q},update(p){mode='update';payload=p;return q},then(ok,bad){let rows;if(mode==='upsert'){let row=demo[table].find(r=>table==='os_learning_weekly_reviews'?r.user_id===payload.user_id&&r.week_start===payload.week_start:r.id===payload.id);if(row&&options.ignoreDuplicates)rows=[];else{if(!row){row={id:crypto.randomUUID(),applied_at:null,reviewed_at:null,archived_at:null};demo[table].push(row);}Object.assign(row,payload);rows=[{...row}];}}else{rows=demo[table].filter(r=>filters.every(([k,v])=>r[k]===v));if(mode==='update')rows.forEach(r=>Object.assign(r,payload));else rows=rows.slice(range[0],range[1]+1);}return Promise.resolve({data:single?rows[0]||null:rows,error:null}).then(ok,bad)}};return q;}};
(async()=>{const base=new URL('../../index.html',location.href),response=await fetch(base.href+'?learning-preview='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('Prévia indisponível');const source=new DOMParser().parseFromString(await response.text(),'text/html');source.querySelectorAll('style').forEach(s=>document.head.append(s.cloneNode(true)));for(const link of source.querySelectorAll('link[rel=stylesheet]')){const copy=link.cloneNode();copy.href=new URL(link.getAttribute('href'),base).href;document.head.append(copy);}const script=document.createElement('script');script.src=new URL(source.querySelector('script[src*="learning-bank.js"]').getAttribute('src'),base).href;script.onload=()=>window.LearningBank.show('bank');script.onerror=()=>document.getElementById('previewNotice').textContent='Falha ao carregar a prévia.';document.body.append(script);})().catch(e=>document.getElementById('previewNotice').textContent=e.message);
</script></body></html>
