  <div class="app"><aside class="side"><div class="brand">Danielle OS<small>MEU SISTEMA PESSOAL</small></div><div class="nav"><button>Visão geral</button><button>James</button><button>Reuniões</button><button class="active" data-page="senioridade">Resultados</button><button>Desenvolvimento</button><button>Financeiro</button></div></aside><main class="main" id="fixtureMain"></main></div>

      ['11-08','project','Liderei a integração entre equipes','Organizamos responsáveis e entregas para o novo fluxo.','Projeto estratégico',true],
      ['10-21','talk','Compartilhei aprendizados com o time','Apresentei práticas de contingência e os principais aprendizados.','Comunicação/Liderança',false],

    ].map(([day,type,title,result,competency,featured],i)=>({id:'sample-'+i,user_id:'preview',evidence_date:fixtureYear+'-'+day,entry_type:type,title,result,competency,domain:competency,featured,evidence_strength:4,situation:'Contexto de demonstração visual.',action_taken:i===0?'Revisei o fluxo com a equipe e documentei as etapas de atendimento.':'',lesson_learned:i===0?'Testar o fluxo com quem atende ajuda a encontrar os gargalos.':'',stakeholder:'Equipe · exemplo',created_at:fixtureYear+'-'+day+'T12:00:00Z',before_value:i===0?'7':null,after_value:i===0?'3':null,metric_unit:i===0?'min':null}));

    var sb={from(table){let mode='read',payload,filters=[],range=[0,999];const q={select(){return q},eq(k,v){filters.push([k,v]);return q},order(){return q},range(a,b){range=[a,b];return q},upsert(p){mode='upsert';payload=p;return q},update(p){mode='update';payload=p;return q},single(){return q},then(ok,bad){let result;if(mode==='upsert'){const item={...payload},i=fixtureTables[table].findIndex(r=>r.id===item.id);if(i<0)fixtureTables[table].push(item);else fixtureTables[table][i]=item;result=item;}else if(mode==='update'){const row=fixtureTables[table].find(r=>filters.every(([k,v])=>r[k]===v));Object.assign(row,payload);result=row;}else result=fixtureTables[table].filter(r=>filters.every(([k,v])=>r[k]===v)).slice(range[0],range[1]+1);return Promise.resolve({data:result,error:null}).then(ok,bad)}};return q},storage:{from(){return {upload:async()=>({error:{message:'Uploads não estão ativos na prévia visual.'}})}}}};
