<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Prévia visual · Foco e Todoist</title><link rel="stylesheet" href="../../focus-workspace.css?v=1"></head><body>
<p style="margin:0;padding:7px 20px;background:#e7ebdf;color:#56634d;font:11px/1.5 system-ui">PRÉVIA DE TESTE · Dados fictícios. Não acessa sua conta, não altera tarefas reais.</p>
<div class="app"><aside class="side"><div class="brand">Danielle OS<small>MEU SISTEMA PESSOAL</small></div><div class="nav"><button>Visão geral</button><button>James</button><button>Reuniões</button><button>Resultados</button><button class="active">Todoist</button><button>Financeiro</button></div></aside><main class="main" id="fixtureMain"></main></div>
<script>
var currentUserId='focus-preview',todoistReadRevision=0;
const demoDay=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const demoNow=Date.now(),storageKey='danielle-focus-fixture-db-v1';
const newDemo=()=>({tasks:[{id:'report',content:'Fechar análise pós-jogo',priority:4,due_date:demoDay},{id:'flow',content:'Revisar o fluxo com a equipe',priority:3,due_date:demoDay},{id:'study',content:'Estudar negociação e registrar aprendizados',priority:1,due_date:demoDay},{id:'next',content:'Preparar a pauta da próxima reunião',priority:1}],focus_settings:[{user_id:currentUserId,focus_minutes:25,break_minutes:5,daily_goal:8}],focus_task_plans:[{user_id:currentUserId,day:demoDay,task_id:'report',task_name:'Fechar análise pós-jogo',category:'work',estimated_minutes:45},{user_id:currentUserId,day:demoDay,task_id:'study',task_name:'Estudar negociação e registrar aprendizados',category:'study',estimated_minutes:25}],focus_sessions:[{id:'sample-focus',user_id:currentUserId,task_id:'report',task_name:'Fechar análise pós-jogo',category:'work',kind:'focus',planned_seconds:1500,status:'completed',elapsed_seconds:1500,started_at:new Date(demoNow-90*60000).toISOString(),finished_at:new Date(demoNow-65*60000).toISOString(),last_started_at:null,segments:[{start:new Date(demoNow-90*60000).toISOString(),end:new Date(demoNow-65*60000).toISOString()}],revision:2}]});
let fixtureDb;try{fixtureDb=JSON.parse(localStorage.getItem(storageKey));}catch{}if(!fixtureDb||fixtureDb.day!==demoDay)fixtureDb={...newDemo(),day:demoDay};
const persistDemo=()=>localStorage.setItem(storageKey,JSON.stringify(fixtureDb));
var sb={from(table){let mode='read',payload,single=false,filters=[],range=[0,999];const q={select(){return q},eq(k,v){filters.push(r=>r[k]===v);return q},gte(k,v){filters.push(r=>r[k]>=v);return q},lte(k,v){filters.push(r=>r[k]<=v);return q},lt(k,v){filters.push(r=>r[k]<v);return q},or(){return q},order(){return q},range(a,b){range=[a,b];return q},maybeSingle(){single=true;return q},single(){single=true;return q},upsert(p){mode='upsert';payload=p;return q},then(ok,bad){let result;if(mode==='upsert'){const arr=fixtureDb[table],keys=table==='focus_task_plans'?['user_id','day','task_id']:['user_id'];let row=arr.find(r=>keys.every(k=>r[k]===payload[k]));if(!row){row=table==='focus_task_plans'?{category:'other',excluded:false}:{};arr.push(row);}Object.assign(row,payload);result={...row};persistDemo();}else{result=(fixtureDb[table]||[]).filter(r=>filters.every(fn=>fn(r))).slice(range[0],range[1]+1);if(single)result=result[0]||null;}return Promise.resolve({data:result,error:null}).then(ok,bad)}};return q;},async rpc(name,p){
 if(name!=='focus_timer_command')throw new Error('Fixture RPC not available');
 let s=fixtureDb.focus_sessions.find(s=>['running','paused'].includes(s.status)),conflict=false;const time=Date.now();
 if(s&&p.p_action!=='status'&&p.p_action!=='start'&&(s.id!==p.p_session_id||(p.p_revision!=null&&p.p_revision!==s.revision&&p.p_command_id!==s.last_command_id)))conflict=true;
 if(!conflict&&s){
  if(s.status==='running'){
   const start=Date.parse(s.last_started_at),effective=['pause','stop'].includes(p.p_action)?Math.min(time,Date.parse(p.p_occurred_at)||time):time,end=Math.min(effective,start+(s.planned_seconds-s.elapsed_seconds)*1000),seconds=Math.max(0,(end-start)/1000);
   if(['pause','stop'].includes(p.p_action)||s.elapsed_seconds+seconds>=s.planned_seconds){if(seconds)s.segments.push({start:s.last_started_at,end:new Date(end).toISOString()});s.elapsed_seconds+=seconds;s.last_started_at=null;s.status=s.elapsed_seconds>=s.planned_seconds?'completed':p.p_action==='stop'?'stopped':'paused';if(['completed','stopped'].includes(s.status))s.finished_at=new Date(end).toISOString();s.revision++;}
  }else if(p.p_action==='resume'){s.status='running';s.last_started_at=new Date(time).toISOString();s.revision++;}else if(p.p_action==='stop'){s.status='stopped';s.finished_at=new Date(time).toISOString();s.revision++;}
  if(p.p_action!=='status')s.last_command_id=p.p_command_id;
 }
 if(p.p_action==='start'){
  if(s&&['running','paused'].includes(s.status)){conflict=s.id!==p.p_session_id;}
  else{s=fixtureDb.focus_sessions.find(s=>s.id===p.p_session_id);if(!s){s={id:p.p_session_id,user_id:currentUserId,task_id:p.p_task_id,task_name:p.p_task_name,category:p.p_category,kind:p.p_kind,planned_seconds:p.p_planned_seconds,status:'running',elapsed_seconds:0,started_at:new Date(time).toISOString(),last_started_at:new Date(time).toISOString(),finished_at:null,segments:[],revision:1,last_command_id:p.p_command_id};fixtureDb.focus_sessions.push(s);}}
 }
 persistDemo();return {data:{session:s?JSON.parse(JSON.stringify(s)):null,server_now:new Date(time).toISOString(),conflict},error:null};
}};
var todoistCall=async function(p={}){if(p.action==='close'){fixtureDb.tasks=fixtureDb.tasks.filter(t=>t.id!==p.id);todoistReadRevision++;persistDemo();return {ok:true};}if(p.action==='create'){fixtureDb.tasks.push({id:crypto.randomUUID(),content:p.content,priority:p.priority||1,due_date:demoDay});todoistReadRevision++;persistDemo();return {ok:true};}const all=fixtureDb.tasks;return {groups:{all,today:all.filter(t=>t.due_date===demoDay),overdue:[],upcoming:[],priority:all.filter(t=>t.priority>1),no_due:all.filter(t=>!t.due_date)},sync:{complete:true,checked_at:new Date().toISOString(),task_count:all.length}};};
var todoistSyncText=data=>data.sync.task_count+' tarefas fictícias conferidas no Todoist de teste.';
var loadTodoistTasks=async function(){const data=await todoistCall({action:'list'});document.getElementById('todoistStatus').textContent=todoistSyncText(data);for(const [id,key]of [['todoToday','today'],['todoOverdue','overdue'],['todoUpcoming','upcoming'],['todoPriority','priority'],['todoNoDue','no_due'],['todoTop3','today']])document.getElementById(id).textContent=data.groups[key].map(t=>t.content).join(' · ')||'Nada aqui.';};
var closeTodoistTask=async id=>{await todoistCall({action:'close',id});await loadTodoistTasks();};
var createTodoistTask=async()=>{const content=document.getElementById('tdContent').value.trim();if(!content)return;await todoistCall({action:'create',content,priority:Number(document.getElementById('tdPriority').value)});document.getElementById('tdContent').value='';await loadTodoistTasks();};
(async()=>{const response=await fetch('../../index.html?focus-preview='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('Prévia indisponível');const source=new DOMParser().parseFromString(await response.text(),'text/html');source.querySelectorAll('style').forEach(s=>document.head.append(s.cloneNode(true)));document.head.append(document.querySelector('link[rel=stylesheet]'));const section=source.querySelector('[data-page=todoist]');section.classList.add('active');document.getElementById('fixtureMain').append(section);const script=document.createElement('script');script.src='../../focus-workspace.js?v=2';script.onload=()=>loadTodoistTasks();document.body.append(script);})();
</script></body></html>
