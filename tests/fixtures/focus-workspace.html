<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Prévia visual · Tarefas e foco</title><link rel="stylesheet" href="../../focus-workspace.css?v=1"></head><body>
<p style="margin:0;padding:7px 20px;background:#e7ebdf;color:#56634d;font:11px/1.5 system-ui">PRÉVIA DE TESTE · Dados fictícios. Não acessa sua conta, não altera tarefas reais. A prévia começa vazia.</p>
<div class="app"><aside class="side"><div class="brand">Danielle OS<small>MEU SISTEMA PESSOAL</small></div><div class="nav"><button>Visão geral</button><button>James</button><button>Reuniões</button><button>Resultados</button><button class="active" data-page="todoist">Tarefas</button><button>Financeiro</button></div></aside><main class="main" id="fixtureMain"></main></div>
<script>
var currentUserId='focus-preview',todoistReadRevision=0;
const demoDay=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const demoNow=Date.now(),storageKey='danielle-native-focus-fixture-v1';
const newDemo=()=>({os_tasks:[],os_task_lists:[],focus_settings:[{user_id:currentUserId,focus_minutes:25,break_minutes:5,daily_goal:8}],focus_task_plans:[],focus_sessions:[]});
let fixtureDb;try{fixtureDb=JSON.parse(localStorage.getItem(storageKey));}catch{}if(!fixtureDb||fixtureDb.day!==demoDay)fixtureDb={...newDemo(),day:demoDay};
const persistDemo=()=>localStorage.setItem(storageKey,JSON.stringify(fixtureDb));
var sb={from(table){let mode='read',payload,single=false,filters=[],range=[0,999],ignoreDuplicates=false;const q={select(){return q},eq(k,v){filters.push(r=>r[k]===v);return q},gte(k,v){filters.push(r=>r[k]>=v);return q},lte(k,v){filters.push(r=>r[k]<=v);return q},lt(k,v){filters.push(r=>r[k]<v);return q},or(){return q},order(){return q},range(a,b){range=[a,b];return q},maybeSingle(){single=true;return q},single(){single=true;return q},upsert(p,options={}){mode='upsert';payload=p;ignoreDuplicates=!!options.ignoreDuplicates;return q},update(p){mode='update';payload=p;return q},then(ok,bad){let result;if(mode==='upsert'){const arr=fixtureDb[table],keys=table==='focus_task_plans'?['user_id','day','task_id']:table==='focus_settings'?['user_id']:['id'];let row=arr.find(r=>keys.every(k=>r[k]===payload[k]));if(row&&ignoreDuplicates){result=[];}else{if(!row){row=table==='focus_task_plans'?{category:'other',excluded:false,task_source:'native'}:table==='os_tasks'?{status:'open',completed_at:null,archived_at:null,priority:1,description:''}:{};arr.push(row);}Object.assign(row,payload);result=single?{...row}:[{...row}];persistDemo();}}else if(mode==='update'){const arr=fixtureDb[table].filter(r=>filters.every(fn=>fn(r)));arr.forEach(row=>Object.assign(row,payload));result=arr.map(row=>({...row}));persistDemo();}else{result=(fixtureDb[table]||[]).filter(r=>filters.every(fn=>fn(r))).slice(range[0],range[1]+1);if(single)result=result[0]||null;}return Promise.resolve({data:result,error:null}).then(ok,bad)}};return q;},async rpc(name,p){
 if(name!=='focus_timer_command')throw new Error('Fixture RPC not available');
 let s=fixtureDb.focus_sessions.find(s=>['running','paused'].includes(s.status)),conflict=false;const time=Date.now();
 if(s&&p.p_action!=='status'&&p.p_action!=='start'&&(s.id!==p.p_session_id||(p.p_revision!=null&&p.p_revision!==s.revision&&p.p_command_id!==s.last_command_id)))conflict=true;
 if(!conflict&&s){
  if(s.status==='running'){
   const start=Date.parse(s.last_started_at),effective=['pause','stop'].includes(p.p_action)?Math.min(time,Date.parse(p.p_occurred_at)||time):time,end=Math.min(effective,start+(s.planned_seconds-s.elapsed_seconds)*1000),seconds=Math.max(0,(end-start)/1000);
   if(['pause','stop'].includes(p.p_action)||s.elapsed_seconds+seconds>=s.planned_seconds){if(seconds)s.segments.push({start:s.last_started_at,end:new Date(end).toISOString()});s.elapsed_seconds+=seconds;s.last_started_at=null;s.status=s.elapsed_seconds>=s.planned_seconds?'completed':p.p_action==='stop'?'stopped':'paused';if(['completed','stopped'].includes(s.status))s.finished_at=new Date(end).toISOString();s.revision++;}
  }else if(p.p_action==='resume'){s.status='running';s.last_started_at=new Date(time).toISOString();s.revision++;}else if(p.p_action==='stop'){s.status='stopped';s.finished_at=new Date(time).toISOString();s.revision++;}
  if(p.p_action!=='status')s.last_command_id=p.p_command_id;
 }
 if(p.p_action==='start'){
  if(s&&['running','paused'].includes(s.status)){conflict=s.id!==p.p_session_id;}
  else{s=fixtureDb.focus_sessions.find(s=>s.id===p.p_session_id);if(!s){s={id:p.p_session_id,user_id:currentUserId,task_id:p.p_task_id,task_name:p.p_task_name,category:p.p_category,kind:p.p_kind,planned_seconds:p.p_planned_seconds,status:'running',elapsed_seconds:0,started_at:new Date(time).toISOString(),last_started_at:new Date(time).toISOString(),finished_at:null,segments:[],revision:1,last_command_id:p.p_command_id};fixtureDb.focus_sessions.push(s);}}
 }
 persistDemo();return {data:{session:s?JSON.parse(JSON.stringify(s)):null,server_now:new Date(time).toISOString(),conflict},error:null};
}};
var todoistCall=async function(p={}){const result=await window.NativeTasks.call(p);if((p.action||'list')!=='list')todoistReadRevision++;return result;};
var todoistSyncText=data=>data.sync.task_count+' tarefas de teste no Danielle OS · sem conta externa.';
var loadTodoistTasks=async function(){const data=await todoistCall({action:'list'});window.NativeTasks.render(data);document.getElementById('todoistStatus').textContent=todoistSyncText(data);};
var loadJamesTodoist=async()=>{};
var closeTodoistTask=async id=>{await todoistCall({action:'close',id});await loadTodoistTasks();};
(async()=>{
 const base=new URL('../../index.html',location.href);
 const response=await fetch(base.href+'?focus-preview='+Date.now(),{cache:'no-store'});
 if(!response.ok)throw new Error('Prévia indisponível');
 const source=new DOMParser().parseFromString(await response.text(),'text/html');
 source.querySelectorAll('style').forEach(style=>document.head.append(style.cloneNode(true)));
 source.querySelectorAll('link[rel=stylesheet]').forEach(link=>{const copy=link.cloneNode();copy.href=new URL(link.getAttribute('href'),base).href;document.head.append(copy);});
 const section=source.querySelector('[data-page=todoist]');section.classList.add('active');document.getElementById('fixtureMain').append(section);
 const loadScript=selector=>new Promise((resolve,reject)=>{const sourceScript=source.querySelector(selector);if(!sourceScript){reject(new Error('Módulo da prévia não encontrado'));return;}const script=document.createElement('script');script.src=new URL(sourceScript.getAttribute('src'),base).href;script.onload=resolve;script.onerror=reject;document.body.append(script);});
 await loadScript('script[src*="native-tasks.js"]');
 await loadScript('script[src*="focus-workspace.js"]');
 await loadTodoistTasks();
})().catch(error=>{document.getElementById('fixtureMain').insertAdjacentText('beforeend','Não foi possível carregar a prévia: '+error.message);});
</script></body></html>
